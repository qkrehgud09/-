<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>초록 공 클릭 게임</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f5;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 650px;
    margin: 40px auto;
}

h1 {
    font-size: 36px;
}

input {
    width: 80%;
    max-width: 350px;

    padding: 15px;

    margin: 8px;

    border: 2px solid #ddd;
    border-radius: 10px;

    font-size: 18px;
}

button {
    padding: 15px 35px;

    margin-top: 15px;

    border: none;
    border-radius: 12px;

    background: #333;
    color: white;

    font-size: 20px;

    cursor: pointer;
}

button:hover {
    background: #555;
}


/* =========================
   게임 화면
========================= */

#gameScreen {
    display: none;
}

#info {

    display: flex;

    justify-content: center;

    gap: 60px;

    margin: 20px;

    font-size: 24px;

    font-weight: bold;
}

#gameArea {

    position: relative;

    width: 100%;

    height: 500px;

    background: white;

    border: 3px solid #333;

    border-radius: 20px;

    overflow: hidden;
}

#ball {

    position: absolute;

    width: 65px;
    height: 65px;

    background: #2ecc71;

    border-radius: 50%;

    cursor: pointer;

    display: none;

    box-shadow:
        0 4px 10px rgba(0,0,0,0.2);
}


/* =========================
   결과 화면
========================= */

#resultScreen {
    display: none;
}

#finalScore {

    font-size: 45px;

    font-weight: bold;

    margin: 25px;
}

.success {
    color: #2ecc71;
}

.error {
    color: #e74c3c;
}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     시작 화면
========================= -->

<div id="startScreen">

    <h1>제일 반응속도 대빵 뽑기</h1>

    <p>
        30초 동안 초록 공을 최대한 많이 클릭하세요!
    </p>


    <input
        type="text"
        id="studentId"
        placeholder="학번 입력"
    >


    <br>


    <input
        type="text"
        id="studentName"
        placeholder="이름 입력"
    >


    <br>


    <button onclick="startGame()">
        게임 시작
    </button>

</div>



<!-- =========================
     게임 화면
========================= -->

<div id="gameScreen">

    <h1>제일고 반응속도 대빵 뽑기</h1>


    <div id="info">

        <div>
            점수:
            <span id="score">0</span>
        </div>


        <div>
            시간:
            <span id="time">30</span>초
        </div>

    </div>


    <p>
        초록 공을 최대한 많이 클릭하세요!
    </p>


    <div id="gameArea">

        <div id="ball"></div>

    </div>

</div>



<!-- =========================
     결과 화면
========================= -->

<div id="resultScreen">

    <h1>🎉 게임 종료!</h1>


    <p id="playerInfo"></p>


    <div id="finalScore">
        0점
    </div>


    <p id="saveMessage">
        점수를 저장하고 있습니다...
    </p>


    <button onclick="location.reload()">
        다시 플레이
    </button>

</div>


</div>



<script>


// =====================================================
// ⭐⭐⭐ Google Apps Script 웹 앱 주소 ⭐⭐⭐
// =====================================================
//
// 아래 따옴표 안에 Apps Script 웹 앱 URL을 넣으세요.
//
// 예:
// "https://script.google.com/macros/s/ABC123456/exec"
//
// 반드시 마지막이 /exec인지 확인하세요.
// =====================================================

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzPeie4aifBvuko93FY1TpedLvUk4lQZ5KB6IVgLQP35NZOr9dm4rVJ0MreQWkLrH4/exec";



// =====================================================
// 게임 변수
// =====================================================

let score = 0;

let time = 30;

let gameRunning = false;

let timer;

let studentId = "";

let studentName = "";



// =====================================================
// 게임 시작
// =====================================================

function startGame() {


    // 학번 가져오기

    studentId =
        document
        .getElementById("studentId")
        .value
        .trim();


    // 이름 가져오기

    studentName =
        document
        .getElementById("studentName")
        .value
        .trim();



    // 학번 검사

    if (studentId === "") {

        alert("학번을 입력해주세요.");

        return;
    }



    // 이름 검사

    if (studentName === "") {

        alert("이름을 입력해주세요.");

        return;
    }



    // 시작 화면 숨기기

    document
        .getElementById("startScreen")
        .style.display = "none";



    // 게임 화면 보이기

    document
        .getElementById("gameScreen")
        .style.display = "block";



    // 게임 초기화

    score = 0;

    time = 30;

    gameRunning = true;



    document
        .getElementById("score")
        .textContent = score;


    document
        .getElementById("time")
        .textContent = time;



    // 공 보이기

    document
        .getElementById("ball")
        .style.display = "block";



    // 공 첫 위치

    moveBall();



    // 1초마다 시간 감소

    timer = setInterval(function() {


        time--;


        document
            .getElementById("time")
            .textContent = time;



        // 시간 종료

        if (time <= 0) {

            endGame();

        }

    }, 1000);

}



// =====================================================
// 공 클릭
// =====================================================

document
    .getElementById("ball")
    .addEventListener("click", function() {


        // 게임 중이 아니면 무시

        if (!gameRunning) {

            return;

        }



        // 점수 +1

        score++;



        document
            .getElementById("score")
            .textContent = score;



        // 공 위치 변경

        moveBall();

    });



// =====================================================
// 공 랜덤 이동
// =====================================================

function moveBall() {


    const gameArea =
        document.getElementById("gameArea");


    const ball =
        document.getElementById("ball");



    const maxX =
        gameArea.clientWidth -
        ball.offsetWidth;


    const maxY =
        gameArea.clientHeight -
        ball.offsetHeight;



    const x =
        Math.random() * maxX;


    const y =
        Math.random() * maxY;



    ball.style.left =
        x + "px";


    ball.style.top =
        y + "px";

}



// =====================================================
// 게임 종료
// =====================================================

function endGame() {


    gameRunning = false;


    clearInterval(timer);



    // 공 숨기기

    document
        .getElementById("ball")
        .style.display = "none";



    // 게임 화면 숨기기

    document
        .getElementById("gameScreen")
        .style.display = "none";



    // 결과 화면 보이기

    document
        .getElementById("resultScreen")
        .style.display = "block";



    // 학생 정보 표시

    document
        .getElementById("playerInfo")
        .textContent =
        studentId + "  " + studentName;



    // 점수 표시

    document
        .getElementById("finalScore")
        .textContent =
        score + "점";



    // Google Sheets 저장

    saveScore();

}



// =====================================================
// ⭐ Google Sheets에 점수 보내기
// =====================================================

function saveScore() {


    // 주소 만들기

    const url =
        GOOGLE_SCRIPT_URL
        + "?studentId="
        + encodeURIComponent(studentId)
        + "&name="
        + encodeURIComponent(studentName)
        + "&score="
        + encodeURIComponent(score);



    // 서버에 요청

    fetch(url, {

        method: "GET",

        mode: "no-cors"

    })


    .then(function() {


        document
            .getElementById("saveMessage")
            .textContent =
            "✅ 점수 저장 요청 완료!";


        document
            .getElementById("saveMessage")
            .className =
            "success";


    })


    .catch(function(error) {


        console.error(error);


        document
            .getElementById("saveMessage")
            .textContent =
            "❌ 점수 저장에 실패했습니다.";


        document
            .getElementById("saveMessage")
            .className =
            "error";

    });

}


</script>


</body>

</html>
